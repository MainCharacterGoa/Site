<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VERDICT — MAIN CHARACTER</title>
  <link rel="icon" type="image/png" href="McLogo.png">

  <!-- Luxury Fonts: Cinzel, Cormorant Garamond, Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Montserrat:wght@100;200;300;400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Oval Horizontal Navbar -->
  <header class="navbar-wrapper">
    <nav class="oval-navbar">
      
      <!-- Left Side: McLogo.png -->
      <div class="nav-left">
        <a href="index.html" class="nav-logo-link" aria-label="Main Character">
          <img src="McLogo.png" alt="Main Character Logo" class="nav-logo">
        </a>
      </div>

      <!-- Right Side: VERDICT and HOUSE buttons with thin font -->
      <div class="nav-right">
        <a href="product.html" class="nav-btn">VERDICT</a>
        <a href="house.html" class="nav-btn">HOUSE</a>
      </div>

    </nav>
  </header>

  <!-- Page Content: Fully Responsive Image fitted to screen with ambient glow -->
  <main class="page-container" id="pageContainer">
    <!-- Ambient Atmospheric Backdrop for seamless non-16:9 scaling -->
    <div class="hero-ambient-bg" aria-hidden="true"></div>

    <img src="heromain.png" alt="Verdict Fragrance - Born in Goa" class="hero-image" id="heroImage">
    
    <!-- Center Hero Callout: BORN IN GOA & DISCOVER -->
    <div class="hero-center-callout hero-right-callout" id="heroCenterCallout">
      <h2 class="hero-tagline">BORN IN GOA</h2>
      <a href="product.html" class="hero-story-btn" id="heroStoryBtn" aria-label="Discover Verdict">
        <span>DISCOVER</span>
      </a>
    </div>
  </main>

  <!-- Main Character Minimal Luxury Footer -->
  <footer class="site-footer" id="footer">
    <div class="footer-container">
      
      <div class="footer-main">
        <!-- Logo & Brand -->
        <a href="index.html" class="footer-logo-link" aria-label="Main Character Home">
          <img src="McLogo.png" alt="Main Character Logo" class="footer-logo">
          <span class="footer-brand-title">MAIN CHARACTER</span>
        </a>

        <!-- Footer Navigation: VERDICT, HOUSE, and @maincharacter -->
        <nav class="footer-nav" aria-label="Footer navigation">
          <a href="product.html" class="footer-nav-btn">VERDICT</a>
          <a href="house.html" class="footer-nav-btn">HOUSE</a>
          <a href="https://instagram.com/maincharacter.goa" target="_blank" rel="noopener noreferrer" class="footer-nav-btn footer-instagram-link" aria-label="Main Character on Instagram">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
            </svg>
            <span>@maincharacter</span>
          </a>
        </nav>
      </div>

      <div class="footer-bottom">
        <span class="copyright-text">&copy; 2026 MAIN CHARACTER. ALL RIGHTS RESERVED.</span>
        <button type="button" class="back-to-top-btn" id="backToTopBtn" aria-label="Back to top">
          <span>TOP</span>
          <svg width="10" height="10" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 13V3M8 3L3.5 7.5M8 3L12.5 7.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

    </div>
  </footer>

  <!-- Notification Toast (Feedback on Click) -->
  <div class="toast" id="toast">You will be notified upon launch.</div>

  <script src="script.js"></script>
</body>
</html>
